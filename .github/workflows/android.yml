name: Generate Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create keystore
        run: |
          keytool -genkey -v -keystore keystroke.jks \
            -alias ${{ secrets.KEY_ALIAS || 'link-si-key' }} \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ${{ secrets.KEYSTORE_PASSWORD || 'link-si-pass' }} \
            -keypass ${{ secrets.KEY_PASSWORD || 'link-si-pass' }} \
            -dname "CN=Linksi, OU=Development, O=Linksi, L=Unknown, ST=Unknown, C=UN"

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: keystroke.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'link-si-pass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'link-si-key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'link-si-pass' }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
